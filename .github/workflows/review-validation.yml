name: Review branch validation

on:
  push:
    branches:
      - review/harness-simplification-v1

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Broad deterministic suite
        run: npm test
      - name: Agent contract suite
        run: npm run test:agents
      - name: Native approval policy contract
        run: node test/test-native-opencode-approval-policy.mjs
